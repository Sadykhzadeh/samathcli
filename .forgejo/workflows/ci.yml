name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3 curl
      - name: it has to build without a warning, and the checks have to pass
        run: make clean check
      - name: and again under the address and undefined behaviour sanitizers
        run: make clean check CFLAGS="-std=c11 -O1 -g -Wall -Wextra -Wpedantic -Wshadow -Wstrict-prototypes -fsanitize=address,undefined -fno-sanitize-recover=undefined"
