name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: it has to build without a warning, and the checks have to pass
        run: make clean check
